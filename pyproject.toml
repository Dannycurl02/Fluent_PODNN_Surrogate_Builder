[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfdtwin"
description = "Neural-network surrogate models for ANSYS Fluent simulations."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Danny Curl", email = "dannycurl02@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "tensorflow>=2.20,<2.21",
    "matplotlib",
    "ansys-fluent-core",
]

[project.optional-dependencies]
# GUI is opt-in: pulling Qt is ~80 MB and headless users (HPC, CI, scripted
# surrogate sweeps) don't need it. `pip install cfdtwin[gui]` adds PySide6
# so the cfdtwin-gui entry point becomes usable.
gui = ["PySide6"]
# Dev extra bundles GUI deps so the local test suite (which includes qtbot
# GUI tests) works out of the box from a fresh clone.
dev = ["pytest", "pytest-qt", "PySide6"]

[project.scripts]
# `cfdtwin-gui` is a thin shim that prints a friendly install hint if
# PySide6 isn't present (i.e. the user did `pip install cfdtwin` without
# the [gui] extra) before launching the real GUI.
cfdtwin-gui = "gui._entry:run"

[project.urls]
Homepage = "https://github.com/UARK-NED3/CFDTwin"
Issues = "https://github.com/UARK-NED3/CFDTwin/issues"

[tool.hatch.version]
path = "cfdtwin/__init__.py"

[tool.hatch.build.targets.wheel]
# `gui` ships in the wheel so the cfdtwin-gui entry point resolves after
# `pip install cfdtwin`. Its top-level name is awkward namespace-wise; see
# BACKLOG L5 for the planned move into cfdtwin.gui.
packages = ["cfdtwin", "gui"]

# .gitignore globs *.png — re-include the GUI logo assets so the installed
# wheel ships with them (window icon + about-screen wordmark).
[tool.hatch.build.targets.wheel.force-include]
"gui/assets/logo_icon.png" = "gui/assets/logo_icon.png"
"gui/assets/logo_wordmark.png" = "gui/assets/logo_wordmark.png"
