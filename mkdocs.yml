site_name: cfdtwin
site_description: Neural-network surrogate models for ANSYS Fluent simulations.
repo_url: https://github.com/UARK-NED3/CFDTwin
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/logo_icon.png
  favicon: assets/logo_icon.png
  palette:
    # CFDTwin brand: blue (#1583B5 / #1E5C79). Material's named colors don't
    # include these exact shades — using the closest fit; finer tuning can
    # come from theme.extra.css later if needed.
    - scheme: default
      primary: blue
      accent: light blue
    - scheme: slate
      primary: blue
      accent: light blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorials:
      - Full workflow: tutorials/full_workflow.md
      - Training tuning: tutorials/training_tuning.md
      - Discovering BC names from Fluent: tutorials/fluent_session.md
  - Examples: examples/README.md
  - API reference:
      - Project: api/project.md
      - Result classes: api/results.md
