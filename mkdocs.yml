site_name: cfdtwin
site_description: Neural-network surrogate models for ANSYS Fluent simulations.
repo_url: https://github.com/UARK-NED3/CFDTwin
edit_uri: edit/master/docs/

# README.md inside docs/examples/ is for users browsing the GitHub repo
# (where the docs site isn't available); index.md is the docs-site page.
# Tell mkdocs to ignore the README so it doesn't try to render both.
exclude_docs: |
  examples/README.md

theme:
  name: material
  logo: assets/logo_icon.png
  favicon: assets/logo_icon.png
  palette:
    # Brand hex (#1E5C79 / #1583B5) overridden via stylesheets/extra.css.
    # The `primary` / `accent` named colors below are the fallback if the
    # CSS doesn't load.
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true     # fail the build if a snippet target is missing

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorials:
      - Full workflow: tutorials/full_workflow.md
      - Training tuning: tutorials/training_tuning.md
      - Discovering BC names from Fluent: tutorials/fluent_session.md
  - Examples: examples/index.md
  - API reference:
      - Project: api/project.md
      - Result classes: api/results.md
