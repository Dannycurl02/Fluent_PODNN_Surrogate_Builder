name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        # -p no:pytestqt disables pytest-qt auto-loading. pytest-qt is in
        # the dev extra for the local GUI test suite, but importing Qt at
        # session start fails on the bare CI runner (no libEGL etc.).
        # Unit tests don't need qtbot.
        run: pytest tests/unit -v -p no:pytestqt
